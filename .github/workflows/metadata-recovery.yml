name: Metadata validation recovery helper
on:
  workflow_call:
    inputs:
      ci_revision:
        description: Exact reviewed helper revision matching the caller pin
        required: true
        type: string
      kind:
        description: Reviewed source workflow family
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  metadata-recovery:
    name: Recover metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_REVISION: ${{ inputs.ci_revision }}
      WORKFLOW_KIND: ${{ inputs.kind }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted recovery helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EndurantDevs/endurant-ci
          ref: ${{ inputs.ci_revision }}
          path: ci
          persist-credentials: false
      - name: Reconcile the exact metadata validation dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/metadata_recovery.py "$WORKFLOW_KIND"
