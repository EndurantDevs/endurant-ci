name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    name: Public CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.11'
          python-version: '3.14.7'
          activate-environment: true
          enable-cache: false
      - name: Install workflow parser
        run: 'uv pip install --only-binary=:all: PyYAML==6.0.3'
      - name: Check public workflow and helper contracts
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/healthcare/test_measurement.py
      - name: Check shell syntax
        run: |
          for script in scripts/drug/check scripts/healthcare/check scripts/healthcare/{compile,install}_python_lock; do
            bash -n "$script"
          done
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
