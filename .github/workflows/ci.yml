name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    name: Public CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
      - name: Install pinned uv
        run: |
          printf '%s\n' 'uv==0.12.12 --hash=sha256:fa5df02fc619a3cc7a58810d6ffeb80ca1e01404b8ef7239bd1cf2103c02cacf' |
            python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r /dev/stdin
          test "$(uv --version | awk '{print $2}')" = 0.12.12
      - name: Install workflow parser
        run: 'uv --no-config pip install --system --only-binary=:all: PyYAML==6.0.3'
      - name: Verify pinned Rust tool downloads on native Linux
        run: |
          tools_directory=$(mktemp -d "$RUNNER_TEMP/rust-ci-tools.XXXXXX")
          trap 'rm -rf -- "$tools_directory"' EXIT
          python scripts/healthcare/install_rust_tools.py "$tools_directory"
          test "$("$tools_directory/cargo-llvm-cov" --version)" = 'cargo-llvm-cov 0.8.7'
          test "$("$tools_directory/cargo-audit" --version)" = 'cargo-audit-audit 0.22.2'
      - name: Check public workflow and helper contracts
        env:
          PUBLIC_CI_DOCKER_COMPATIBILITY: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/healthcare/test_measurement.py
      - name: Check shell syntax
        run: |
          for script in scripts/drug/check scripts/healthcare/check scripts/healthcare/{compile,install}_python_lock; do
            bash -n "$script"
          done
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
