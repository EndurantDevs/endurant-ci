name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    name: Public CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Check public workflow and helper contracts
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/healthcare/test_measurement.py
      - name: Check shell syntax
        run: if [ -d scripts ]; then find scripts -type f \( -name check -o -name '*.sh' \) -exec bash -n '{}' +; fi
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
