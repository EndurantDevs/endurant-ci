        name: mrf-python-coverage-postgres-provider-directory-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/healthcare-artifacts/.coverage.postgres.provider-directory

          ${{ runner.temp }}/healthcare-artifacts/.coverage-provenance.postgres.provider-directory.json'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
      id: coverage-artifact
    outputs:
      artifact_id: ${{ steps.coverage-artifact.outputs.artifact-id }}
  address-canonical-db-tests-provider-profile:
    name: postgres18 postgis tests (provider-profile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - public-hygiene
    - readability-preflight
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:0aacdfb9dda40942d424785c3ccabeffe31da9cc9e26b0dfd93b222b31462871
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ptg2_v3_lifecycle_test_ci_runner
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d ptg2_v3_lifecycle_test_ci_runner" --health-interval 2s --health-timeout
          5s --health-retries 25
    env:
      PYTEST_ADDOPTS: --cov-config=test-coverage.ini --cov=api --cov=db --cov=process --cov=public_evidence --cov=service
        --cov=main --cov-branch --cov-report= --cov-append
      HLTHPRT_DB_DRIVER: asyncpg
      HLTHPRT_DB_PORT: '5432'
      HLTHPRT_DB_USER: postgres
      HLTHPRT_DB_PASSWORD: postgres
      HLTHPRT_DB_DATABASE: ptg2_v3_lifecycle_test_ci_runner
      HLTHPRT_DB_SCHEMA: mrf
      DB_SCHEMA: mrf
      HLTHPRT_REDIS_ADDRESS: redis://127.0.0.1:6379
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: ${{ inputs.ci_revision }}
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Install PostgreSQL client
      run: 'sudo apt-get update -qq

        sudo apt-get install --yes --no-install-recommends postgresql-client'
    - name: Download exact-source Rust test binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.public-hygiene.outputs.rust_artifact_id || 'missing' }}
        digest-mismatch: error
        path: rust-debug-binaries
    - name: Run complete validation stage
      env:
        HLTHPRT_DB_HOST: 127.0.0.1
        CI_RUST_BINARIES: ${{ github.workspace }}/rust-debug-binaries
      run: 'bash "$CI_ROOT/scripts/healthcare/check" postgres "provider-profile"

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    - name: Upload PostgreSQL coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mrf-python-coverage-postgres-provider-profile-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/healthcare-artifacts/.coverage.postgres.provider-profile

          ${{ runner.temp }}/healthcare-artifacts/.coverage-provenance.postgres.provider-profile.json'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
      id: coverage-artifact
    outputs:
      artifact_id: ${{ steps.coverage-artifact.outputs.artifact-id }}
  measurement:
    name: public measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - public-hygiene
    - readability-preflight
    - python-quality
    - python-tests-0
    - python-tests-1
    - python-tests-2
    - python-tests-3
    - capacity-evidence
    - api-contract
    - rust-scanner
    - container-package
    - security
    - worker-queue-smoke
    - address-canonical-db-tests-core
    - address-canonical-db-tests-provider-directory
    - address-canonical-db-tests-provider-profile
    if: ${{ always() }}
    steps:
    - name: Require all validation jobs
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: jq -e 'length > 0 and all(. == "success")' <<< "$RESULTS"
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: ${{ inputs.ci_revision }}
        path: ci
        persist-credentials: false
    - name: Resolve exact source event
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 ci/scripts/source_identity.py
      working-directory: ${{ github.workspace }}
    - name: Download immutable measurement artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.python-tests-0.outputs.artifact_id }},${{ needs.python-tests-1.outputs.artifact_id }},${{
          needs.python-tests-2.outputs.artifact_id }},${{ needs.python-tests-3.outputs.artifact_id }},${{ needs.capacity-evidence.outputs.artifact_id
          }},${{ needs.rust-scanner.outputs.artifact_id }},${{ needs.address-canonical-db-tests-core.outputs.artifact_id }},${{
          needs.address-canonical-db-tests-provider-directory.outputs.artifact_id }},${{ needs.address-canonical-db-tests-provider-profile.outputs.artifact_id
          }}
        digest-mismatch: error
        path: ${{ runner.temp }}/healthcare-coverage-staging
        merge-multiple: false
    - name: Validate and bind public measurement
      run: python3 ci/scripts/healthcare/measurement.py
    - name: Upload public measurement
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: healthcare-public-measurement-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/healthcare-public-measurement/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
  source-validation:
    name: source validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
    - measurement
    permissions: {}
    steps:
    - name: Require complete public validation
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: jq -e 'length > 0 and all(. == "success")' <<< "$RESULTS"
