name: Healthcare public source validation
'on':
  workflow_call:
    inputs:
      ci_revision:
        description: Exact reviewed Endurance CI commit matching the caller pin
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
  actions: read
env:
  CI_ROOT: ${{ github.workspace }}/ci
  CI_REVISION: ${{ inputs.ci_revision }}
  SOURCE_ROOT: ${{ github.workspace }}/source
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  public-hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: ${{ inputs.ci_revision }}
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
      with:
        rust: 'true'
    - name: Run complete validation stage
      run: 'bash "$CI_ROOT/scripts/healthcare/check" hygiene &

        hygiene_pid=$!

        cargo_status=0

        cargo build --locked --bins --manifest-path support/ptg2_scanner/Cargo.toml || cargo_status=$?

        wait "$hygiene_pid"

        test "$cargo_status" = 0


        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    - name: Stage shared Rust test binaries
      run: "binary_directory=\"$GITHUB_WORKSPACE/rust-debug-binaries\"\nmkdir -p \"$binary_directory\"\ninstall -m 0755 \\\
        \n  support/ptg2_scanner/target/debug/ptg2_scanner \\\n  support/ptg2_scanner/target/debug/ptg2_provider_graph_v4\
        \ \\\n  support/ptg2_scanner/target/debug/raw_claim_check \\\n  support/ptg2_scanner/target/debug/uhc_semantic_facts\
        \ \\\n  \"$binary_directory/\"\n"
    - name: Upload exact-source Rust test binaries
      id: rust-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: healthcare-rust-debug-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'rust-debug-binaries/ptg2_scanner

          rust-debug-binaries/ptg2_provider_graph_v4

          rust-debug-binaries/raw_claim_check

          rust-debug-binaries/uhc_semantic_facts'
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    outputs:
      rust_artifact_id: ${{ steps.rust-artifact.outputs.artifact-id }}
  readability-preflight:
    name: readability preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: ${{ inputs.ci_revision }}
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Check readability before starting heavy jobs
      run: python scripts/readability_budget.py --base "$BASE_SHA"
  python-quality:
    name: python quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: ${{ inputs.ci_revision }}
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Run complete validation stage
      run: 'bash "$CI_ROOT/scripts/healthcare/check" quality

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
  python-tests-0:
    name: python test suite (0/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - public-hygiene
    - readability-preflight
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Check out pinned public CI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: EndurantDevs/endurant-ci
        ref: ${{ inputs.ci_revision }}
        path: ci
        persist-credentials: false
    - name: Prepare source and toolchain
      uses: ./ci/scripts/healthcare/setup
    - name: Download exact-source Rust test binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.public-hygiene.outputs.rust_artifact_id || 'missing' }}
        digest-mismatch: error
        path: rust-debug-binaries
    - name: Run complete validation stage
      env:
        CI_RUST_BINARIES: ${{ github.workspace }}/rust-debug-binaries
      run: 'bash "$CI_ROOT/scripts/healthcare/check" python-main "0"

        git diff --exit-code

        git diff --cached --exit-code

        test -z "$(git ls-files --others --exclude-standard)"'
    - name: Upload main-suite coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mrf-python-coverage-main-0-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/healthcare-artifacts/.coverage.main.0

          ${{ runner.temp }}/healthcare-artifacts/.coverage-provenance.main.0.json'
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
      id: coverage-artifact
    outputs:
      artifact_id: ${{ steps.coverage-artifact.outputs.artifact-id }}
